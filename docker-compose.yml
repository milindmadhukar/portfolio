# Production deployment on `limitless` (Hetzner, Tailscale 100.74.136.119).
#
# Deployed from ~/docker/portfolio, which holds only this file and a .env -
# no source, since prod pulls prebuilt images built by
# .github/workflows/docker-publish.yml. Same convention as ~/docker/stonksapi.
#
#   docker compose pull && docker compose up -d
#
# The box already runs Traefik v3.7.10 (~/docker/traefik) on the external
# `reverse_proxy` network, so this attaches to that rather than shipping a
# proxy of its own. Certs come from `milindresolver`, which uses the Cloudflare
# DNS-01 challenge - so issuance does not depend on DNS pointing here, and no
# HTTP-01 entrypoint juggling is needed.
#
# The GHCR packages are private (the web image contains the blog markdown,
# unpublished drafts included), so the host needs `docker login ghcr.io` with a
# read:packages token before the first pull.

services:
  portfolio:
    image: ghcr.io/milindmadhukar/portfolio:latest
    container_name: portfolio
    restart: always
    environment:
      - NODE_ENV=production
      - LANYARD_SOCKET_URL=${LANYARD_SOCKET_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    labels:
      - "traefik.enable=true"
      # Required because this service sits on two networks - without pinning,
      # Traefik can resolve the container on `internal` and fail to reach it.
      - "traefik.docker.network=reverse_proxy"
      - "traefik.http.routers.portfolio.rule=Host(`milind.dev`)"
      # websecure only: the `web` entrypoint already carries a global redirect
      # to websecure, so listing it here would be shadowed anyway.
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=milindresolver"
      - "traefik.http.services.portfolio.loadbalancer.server.port=4321"
    networks:
      - reverse_proxy
      - internal

  ssh-portfolio:
    image: ghcr.io/milindmadhukar/portfolio-ssh:latest
    container_name: ssh-portfolio
    restart: always
    environment:
      - SSH_HOST=0.0.0.0
      # Pinned to 2222, deliberately NOT ${SSH_PORT}. SSH_PORT is the *host*
      # port Traefik publishes (22); the container always listens on 2222, which
      # is what the TCP service below points at. Wiring ${SSH_PORT} in here
      # would make the Go server bind :22 inside the container while Traefik
      # forwarded to :2222 - a dead route.
      - SSH_PORT=2222
      - PORTFOLIO_API=http://portfolio:4321/api/commands
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse_proxy"
      # SSH carries no SNI, so this is a catch-all on a dedicated entrypoint.
      # That entrypoint is published on the *public* IP only (see
      # ~/docker/traefik/docker-compose.yml); the host's real sshd holds the
      # Tailscale address, so the two never collide.
      - "traefik.tcp.routers.ssh.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.ssh.entrypoints=ssh"
      - "traefik.tcp.services.ssh.loadbalancer.server.port=2222"
    # No published ports: everything reaches this over the docker network.
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - ssh_data:/data
    networks:
      - reverse_proxy
      - internal

volumes:
  # The wish host key is generated into /data on first boot (HOST_KEY_PATH is
  # /data/id_ed25519, and the image is FROM scratch + read_only, so this is the
  # only writable path). A named volume keeps it stable across redeploys -
  # losing it makes every returning client warn about a changed host key.
  ssh_data:

networks:
  # Created by hand on the box (`docker network create reverse_proxy`); Traefik
  # is attached to it.
  reverse_proxy:
    name: reverse_proxy
    external: true
  # Private hop for ssh-portfolio -> portfolio, so the service name cannot
  # collide with another app's service on the shared network.
  internal:
