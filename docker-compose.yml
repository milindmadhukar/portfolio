# Dokploy deployment.
#
# Dokploy runs its own Traefik, so routing happens with labels against the
# shared `dokploy-network` instead of a self-managed reverse proxy. The
# previous standalone setup is kept verbatim in docker-compose.traefik.yml.
#
# Differences that matter, versus that file:
#   - no container_name: Dokploy needs to name containers itself, otherwise
#     logs, metrics and the redeploy button break
#   - no watchtower labels: Dokploy redeploys on its own webhook
#   - HTTP routing is configured in the dashboard (Domains tab), not here
#   - ssh-portfolio publishes its port directly rather than routing through
#     Traefik (see the note on that service)
#
# Dokploy must have "Enable Submodules" OFF for this service (Provider tab).
# It only needs this file - both services run prebuilt public images from ghcr,
# so there is no build context and website/blog-content is never read here. With
# the toggle on, the clone recurses into the private blog repo and fails: Dokploy
# clones as https://oauth2:<token>@github.com/..., and git will not reuse that
# credential for a submodule pointing at a different repo.
#
# The domain is configured in Dokploy's Domains tab (host milind.dev, service
# portfolio, port 4321, HTTPS via letsencrypt); Dokploy injects the router,
# service and redirect labels at deploy time. Do not add traefik router labels
# here as well - the two would fight over the same router names.

services:
  portfolio:
    image: ghcr.io/milindmadhukar/portfolio:latest
    restart: always
    environment:
      - NODE_ENV=production
      - LANYARD_SOCKET_URL=${LANYARD_SOCKET_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    labels:
      # Routers/services come from the Domains tab. This one stays: it is a
      # network hint, not domain config, and it is still needed because this
      # service sits on two networks - without pinning, Traefik can resolve the
      # container on `internal` and fail to reach it.
      - "traefik.docker.network=dokploy-network"
    networks:
      - dokploy-network
      - internal

  ssh-portfolio:
    image: ghcr.io/milindmadhukar/portfolio-ssh:latest
    restart: always
    environment:
      - SSH_HOST=0.0.0.0
      - SSH_PORT=2222
      - PORTFOLIO_API=http://portfolio:4321/api/commands
    # Dokploy's Traefik only defines HTTP entrypoints. Routing raw SSH through
    # it needs a TCP entrypoint added to Traefik's *static* config on the host
    # plus that port bound on the Traefik container - server-side setup this
    # file cannot express. Publishing the port directly keeps the deployment
    # self-contained.
    #
    # Bound to one specific public address on port 22, so the advertised command
    # is a bare `ssh milind.dev`. SSH carries no SNI, so a proxy cannot tell
    # `ssh milind.dev` from `ssh <that ip>` - the split between the portfolio and
    # the host's real sshd has to be made by address, not hostname.
    #
    # Three things this depends on, all outside this file:
    #   - the host's sshd must not hold 0.0.0.0:22, or this bind fails. On
    #     Ubuntu 24.04 sshd is socket-activated, so ListenAddress in
    #     sshd_config is ignored; it is set via a drop-in at
    #     /etc/systemd/system/ssh.socket.d/override.conf that binds the
    #     Tailscale address only.
    #   - milind.dev must be DNS-only in Cloudflare; the proxy carries HTTP(S)
    #     only, so SSH to a proxied record just times out.
    #   - milind.dev must have no AAAA pointing at the host, or v6 clients reach
    #     the real sshd instead of this.
    #
    # Defaults stay 0.0.0.0:2222 so a local `docker compose up` is unaffected;
    # Dokploy sets SSH_BIND_ADDR and SSH_PORT. The container always listens on
    # 2222 internally, so cap_drop: ALL is fine - the host does the privileged
    # bind.
    ports:
      - "${SSH_BIND_ADDR:-0.0.0.0}:${SSH_PORT:-2222}:2222"
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - ssh_data:/data
    networks:
      - internal

volumes:
  # The wish host key is generated into /data on first boot (HOST_KEY_PATH is
  # /data/id_ed25519, and the image is FROM scratch + read_only, so this is the
  # only writable path). A named volume keeps it stable across redeploys -
  # losing it makes every returning client warn about a changed host key.
  ssh_data:

networks:
  # Created by Dokploy; Traefik is attached to it.
  dokploy-network:
    external: true
  # Private hop for ssh-portfolio -> portfolio, so the service name cannot
  # collide with another app's service on the shared network.
  internal:
