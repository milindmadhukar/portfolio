name: Docker

on:
  push:
    branches: [ "main" ]
  # Trigger via API from the blog repo
  repository_dispatch:
    types: [blog_update]
  # Allow manual runs
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The blog repo dispatches here when a post changes. Bump the pinned submodule
  # commit and push; that push is what triggers the build below.
  bump-blog:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # PAT_TOKEN, not GITHUB_TOKEN: it needs read access to the private blog
      # repo, and pushes made with GITHUB_TOKEN do not trigger workflows.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Bump blog content
        run: |
          git submodule update --remote website/blog-content

          if git diff --quiet -- website/blog-content; then
            echo "Blog content already up to date, nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump blog content" -- website/blog-content
          git push

  build:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portfolio
            context: ./website
            image-name: ${{ github.repository }}
          - name: ssh-portfolio
            context: ./ssh-server
            image-name: ${{ github.repository }}-ssh

    steps:
      # PAT_TOKEN: the blog-content submodule lives in a private repo, which the
      # default GITHUB_TOKEN cannot read.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image-name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # build-args are not needed for secrets when using --mount
          secrets: |
            gh_token=${{ secrets.PAT_TOKEN }}

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
