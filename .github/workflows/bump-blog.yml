name: Blog content

on:
  # The blog repo dispatches this when a post changes. Nothing else needs to run
  # here any more: images are built on the Dokploy host, and Dokploy deploys off
  # its own GitHub webhook.
  repository_dispatch:
    types: [blog_update]
  # Allow manual runs
  workflow_dispatch:

jobs:
  # The blog repo dispatches here when a post changes. Bump the pinned submodule
  # commit and push; Dokploy builds and deploys off that push.
  bump-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # PAT_TOKEN is what can read the private blog repo, so it has to be the
      # checkout token for the submodule to resolve.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Bump blog content
        run: |
          git submodule update --remote website/blog-content

          if git diff --quiet -- website/blog-content; then
            echo "Blog content already up to date, nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump blog content" -- website/blog-content

          # PAT_TOKEN is read-only on this repo, so push as GITHUB_TOKEN, which
          # has contents: write above. Dokploy deploys off its own GitHub webhook,
          # which is unaffected by which token pushed.
          #
          # checkout persists PAT_TOKEN as an auth header for github.com, and it
          # outranks credentials in the push URL, so drop it first. The submodule
          # fetch above is already done by this point.
          git config --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:main
